<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark background with rounded corners matching site -->
  <rect width="100" height="100" rx="20" fill="#0a0a0a"/>

  <!-- Subtle orange glow layer -->
  <rect width="100" height="100" rx="20" fill="#f97316" opacity="0.06"/>

  <!-- Geometric A inspired by logo:
       Left diagonal stroke (long, like the logo's tall A)
       Right diagonal stroke
       Crossbar in the middle
  -->

  <!-- Left leg: top-center down to bottom-left -->
  <polygon
    points="50,14  42,14  18,80  26,80"
    fill="#f97316"
  />

  <!-- Right leg: top-center down to bottom-right -->
  <polygon
    points="50,14  58,14  82,80  74,80"
    fill="#f97316"
  />

  <!-- Crossbar — sits at ~55% height like the logo -->
  <rect x="30" y="52" width="40" height="7" rx="2" fill="#f97316"/>

  <!-- Inner cutout on left leg (triangle gap like logo) -->
  <polygon
    points="50,20  44,20  34,48  41,48"
    fill="#0a0a0a"
  />

  <!-- Inner cutout on right leg -->
  <polygon
    points="50,20  56,20  66,48  59,48"
    fill="#0a0a0a"
  />
</svg>
